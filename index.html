<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#00bec0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' blob:; connect-src 'none'; worker-src 'self'; manifest-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Booyo · learn &amp; play at home</title>
  <meta name="apple-mobile-web-app-title" content="Booyo">
  <link rel="icon" href="icons/favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <!-- manifest + service worker are added by app.js when served over http(s); file:// can't use them -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app" aria-live="polite"></div>
  <noscript><p style="font:20px sans-serif;padding:20px">Please turn on JavaScript to use Booyo.</p></noscript>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
